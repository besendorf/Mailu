name: Mailbox encryption

on:
  push:
    branches: [per-user-mail-crypt]
  pull_request:
    paths:
      - core/admin/**
      - core/dovecot/**
      - core/base/requirements-*.txt
      - scripts/mail-crypt/**
      - tests/**
      - .github/workflows/mail-crypt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encryption:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Dovecot 2.4 and Python
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3-venv dovecot-core dovecot-imapd dovecot-lmtpd lua-cjson libmagic1 openssl
          python3 -m venv /opt/mailu-tests
          /opt/mailu-tests/bin/pip install -r tests/mail-crypt-requirements.txt -e core/base/libs/socrate -e core/base/libs/podop
          useradd --create-home --uid 1000 mailu-test
      - name: Test credential envelopes
        run: /opt/mailu-tests/bin/python -m unittest discover -s scripts/mail-crypt/tests -v
      - name: Test application and real Dovecot delivery
        run: |
          runuser -u mailu-test -- env CREDENTIAL_ROUNDS=4 \
            DOVECOT_TEST_IMAP=/usr/lib/dovecot/imap \
            DOVECOT_TEST_DOVEADM=/usr/bin/doveadm \
            DOVECOT_TEST_LDA=/usr/lib/dovecot/deliver \
            DOVECOT_TEST_MASTER=/usr/sbin/dovecot \
            DOVECOT_TEST_LIBEXEC=/usr/lib/dovecot \
            DOVECOT_TEST_MODULES=/usr/lib/dovecot/modules \
            /opt/mailu-tests/bin/python -m pytest tests/anonmail -q -o cache_dir=/tmp/mailu-test-cache
